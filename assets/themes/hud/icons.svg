      <rect x="16" y="30" width="32" height="3" class="huac"/>
      <rect x="20" y="18" width="24" height="3" class="huwh" opacity=".5"/>
      <rect x="20" y="24" width="18" height="3" class="huwh" opacity=".5"/>
