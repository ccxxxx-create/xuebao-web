      <rect x="30.5" y="6" width="3" height="8" fill="currentColor"/>
      <rect x="30.5" y="50" width="3" height="8" fill="currentColor"/>
      <rect x="6" y="30.5" width="8" height="3" fill="currentColor"/>
      <rect x="50" y="30.5" width="8" height="3" fill="currentColor"/>
