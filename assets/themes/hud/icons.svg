  <use href="#hu-overview"  x="0"   width="64" height="64" color="#a9f5c0"/>
  <use href="#hu-library"   x="64"  width="64" height="64" color="#a9f5c0"/>
  <use href="#hu-favorites" x="128" width="64" height="64" color="#a9f5c0"/>
  <use href="#hu-ranking"   x="192" width="64" height="64" color="#a9f5c0"/>
  <use href="#hu-journal"   x="256" width="64" height="64" color="#a9f5c0"/>
  <use href="#hu-sources"   x="320" width="64" height="64" color="#a9f5c0"/>
  <use href="#hu-terms"     x="384" width="64" height="64" color="#a9f5c0"/>
  <use href="#hu-interests" x="448" width="64" height="64" color="#a9f5c0"/>
  <use href="#hu-settings"  x="512" width="64" height="64" color="#a9f5c0"/>
