<svg xmlns="http://www.w3.org/2000/svg" width="576" height="64" viewBox="0 0 576 64">
  <!-- 终端 · 战术 HUD 风侧栏图标组（9 枚 · 64×64 格线 · 主体 currentColor · .huac 琥珀点缀 / .huwh 高亮） -->
  <defs>
    <style>
      .huac { fill: #ffb347; }
      .hudk { fill: #000; opacity: .3; }
      .huwh { fill: #d9ffe4; opacity: .9; }
    </style>
    <symbol id="hu-overview" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="20" fill="none" stroke="currentColor" stroke-width="4"/>
      <rect x="30.5" y="22" width="3" height="20" fill="currentColor"/>
      <rect x="22" y="30.5" width="20" height="3" fill="currentColor"/>
      <circle cx="32" cy="32" r="4" class="huwh"/>
      <circle cx="32" cy="32" r="1.5" class="huac"/>
      <path d="M12 12 L12 20 M12 12 L20 12 M52 12 L52 20 M52 12 L44 12 M12 52 L12 44 M12 52 L20 52 M52 52 L52 44 M52 52 L44 52" stroke="currentColor" stroke-width="3" fill="none"/>
      <path d="M8 26 L8 30 M56 26 L56 30 M26 8 L30 8 M26 56 L30 56" stroke="currentColor" stroke-width="3" fill="none"/>
    </symbol>
