      <rect x="12" y="8" width="40" height="6" rx="3" class="huwh" opacity=".35"/>
      <rect x="16" y="18" width="6" height="4" class="huac"/>
      <rect x="26" y="18" width="22" height="4" class="huwh" opacity=".55"/>
      <rect x="16" y="28" width="6" height="4" class="huac"/>
      <rect x="26" y="28" width="16" height="4" class="huwh" opacity=".55"/>
      <rect x="16" y="38" width="6" height="4" class="huac"/>
      <rect x="26" y="38" width="26" height="4" class="huwh" opacity=".5"/>
      <rect x="26" y="44" width="8" height="5" class="huwh"/>
