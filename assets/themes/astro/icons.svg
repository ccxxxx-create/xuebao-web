<svg xmlns="http://www.w3.org/2000/svg" width="576" height="64" viewBox="0 0 576 64">
  <!-- 星图罗盘 · 古典天文导航侧栏图标组（9 枚 · 64×64 格线 · 主体 currentColor 铜青 · .asac 黄铜金 #d8b45a / .aswh 星点白） -->
  <defs>
